name: dump-base

on:
  schedule:
    - cron: "58 1 * * 5"
  workflow_dispatch:

concurrency:
  group: dump-base
  cancel-in-progress: true

jobs:
  dump:
    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: read

    strategy:
      fail-fast: false
      matrix:
        runtime:
          - base.al2023
    steps:
      - uses: docker/setup-qemu-action@v4.4.0
      - uses: docker/setup-buildx-action@v4.4.1
      - uses: actions/checkout@v7.0.1
      - uses: shogo82148/actions-setup-perl@v1.44.4
        with:
          perl-version: "5.40"
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          aws-region: us-east-1
          role-to-assume: arn:aws:iam::941678122026:role/GitHubActions-us-east-1

      - name: Dump the file system
        run: |
          make dump
        working-directory: dump/${{ matrix.runtime }}

      - name: Update Dockerfile
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ./scripts/update_dockerfile.pl ${{ matrix.runtime }}

      # commit and push
      - id: generate
        uses: shogo82148/actions-github-app-token@v1.3.4
      - name: Commit and push
        uses: shogo82148/actions-commit-and-create-pr@v1.1.4
        with:
          head-branch-prefix: dump-${{ matrix.runtime }}/
          github-token: ${{ steps.generate.outputs.token }}
          commit-message: update ${{ matrix.runtime }}
